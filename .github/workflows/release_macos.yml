name: release_macos

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle_macos:
    runs-on:
      - self-hosted
      - soukou-macos
    timeout-minutes: 90
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SOUKOU_SITE_URL: https://soukou.dev
      SOUKOU_SUPABASE_URL: ${{ secrets.SOUKOU_SUPABASE_URL }}
      SOUKOU_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SOUKOU_SUPABASE_PUBLISHABLE_KEY }}
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        if: runner.environment != 'self-hosted'
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked

      - name: Build macOS release assets
        run: ./scripts/bundle-mac.sh ${{ matrix.target }}

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: soukou-macos-${{ matrix.target }}.app
          path: target/${{ matrix.target }}/release/bundle/osx/草稿.app
          if-no-files-found: error

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: soukou-macos-${{ matrix.target }}.dmg
          path: target/${{ matrix.target }}/release/草稿-*.dmg
          if-no-files-found: error

      - name: Upload disk image to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          repository: monjara/Soukou.app
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          files: target/${{ matrix.target }}/release/草稿-*.dmg
