name: release_macos

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle_macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked

      - name: Build macOS release assets
        run: ./scripts/bundle-mac.sh ${{ matrix.target }}

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Genko-${{ matrix.target }}.app
          path: target/${{ matrix.target }}/release/bundle/osx/Genko.app
          if-no-files-found: error

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: Genko-${{ matrix.target }}.dmg
          path: target/${{ matrix.target }}/release/Genko-*.dmg
          if-no-files-found: error
