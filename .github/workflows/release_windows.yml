name: release_windows

on:
  push:
    tags:
      - "v*"
      - "dev*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SOUKOU_AUTH_CALLBACK_SCHEME: soukou
  SOUKOU_SITE_URL: https://soukou.dev
  SOUKOU_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SOUKOU_SUPABASE_PUBLISHABLE_KEY }}
  SOUKOU_SUPABASE_URL: ${{ secrets.SOUKOU_SUPABASE_URL }}

concurrency:
  group: release-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle_windows:
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 60
    strategy:
      matrix:
        target:
          - x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify Rust toolchain commands
        shell: cmd
        run: |
          where rustup
          where cargo

      - name: Ensure Rust target is installed
        shell: cmd
        run: rustup target add ${{ matrix.target }}-pc-windows-msvc

      - name: Build Windows release archive
        shell: cmd
        run: powershell -ExecutionPolicy Bypass -File .\scripts\bundle-windows.ps1 -Architecture ${{ matrix.target }}

      - name: Upload Windows archive
        uses: actions/upload-artifact@v7
        with:
          name: soukou-${{ matrix.target }}-pc-windows-msvc.zip
          path: target/${{ matrix.target }}-pc-windows-msvc/release/soukou-windows-${{ matrix.target }}.zip
          if-no-files-found: error

      - name: Upload Windows archive to GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          repository: monjara/Soukou.app
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          files: target/${{ matrix.target }}-pc-windows-msvc/release/soukou-windows-${{ matrix.target }}.zip
