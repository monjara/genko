name: release_windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle_windows:
    runs-on:
      - self-hosted
      - soukou-windows
    timeout-minutes: 60
    strategy:
      matrix:
        target:
          - x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Cargo bin directory to PATH
        shell: cmd
        run: |
          if exist "%USERPROFILE%\.cargo\bin\rustup.exe" echo %USERPROFILE%\.cargo\bin>>"%GITHUB_PATH%"
          if exist "%LOCALAPPDATA%\Programs\Rust\bin\rustup.exe" echo %LOCALAPPDATA%\Programs\Rust\bin>>"%GITHUB_PATH%"
          for /D %%D in (C:\Users\*) do @if exist "%%D\.cargo\bin\rustup.exe" echo %%D\.cargo\bin>>"%GITHUB_PATH%"

      - name: Verify Rust toolchain commands
        shell: cmd
        run: |
          echo USERPROFILE=%USERPROFILE%
          where rustup
          where cargo

      - name: Ensure Rust target is installed
        shell: cmd
        run: rustup target add ${{ matrix.target }}-pc-windows-msvc

      - name: Build Windows release archive
        shell: cmd
        run: powershell -ExecutionPolicy Bypass -File .\scripts\bundle-windows.ps1 -Architecture ${{ matrix.target }}

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: 草稿-${{ matrix.target }}-pc-windows-msvc.zip
          path: target/${{ matrix.target }}-pc-windows-msvc/release/soukou-windows-${{ matrix.target }}.zip
          if-no-files-found: error

      - name: Upload Windows archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}-pc-windows-msvc/release/soukou-windows-${{ matrix.target }}.zip
