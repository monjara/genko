[workspace]
resolver = "3"
members = [
  ".",
  "crates/editor",
  "crates/env",
  "crates/genko",
  "crates/rope",
  "crates/settings",
  "crates/theme",
  "crates/vim"
]
default-members = ["crates/genko"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
gpui = { package = "gpui", git = "https://github.com/monjara/zed", branch = "vertical-text-feature" }
gpui_platform = { package = "gpui_platform", git = "https://github.com/monjara/zed", branch = "vertical-text-feature", features = [
  "font-kit",
  "runtime_shaders",
  "wayland",
  "x11"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xdg = "3.0.0"

editor = { path = "crates/editor" }
env = { path = "crates/env" }
rope = { path = "crates/rope" }
settings = { path = "crates/settings" }
theme = { path = "crates/theme" }
vim = { path = "crates/vim" }
