[workspace]
members = [".", "crates/genko_rope"]
default-members = [".", "crates/genko_rope"]
resolver = "3"

[package]
name = "genko"
version = "0.1.0"
edition = "2024"

[dependencies]
genko_rope = { path = "crates/genko_rope" }
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xdg = "3.0.0"
