[workspace]
resolver = "3"
members = [".", "crates/genko", "crates/rope", "crates/settings", "crates/vim"]
default-members = ["crates/genko"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
rope = { path = "crates/rope" }
settings = { path = "crates/settings" }
vim = { path = "crates/vim" }

gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xdg = "3.0.0"
