[workspace]
resolver = "3"
members = [
  ".",
  "crates/auth",
  "crates/bottom_bar",
  "crates/document",
  "crates/editor",
  "crates/env",
  "crates/icons",
  "crates/keymap",
  "crates/menu",
  "crates/rich_text",
  "crates/rope",
  "crates/settings",
  "crates/soukou",
  "crates/theme",
  "crates/tiny_segmenter",
  "crates/title_bar",
  "crates/ui",
  "crates/workspace"
]
default-members = ["crates/soukou"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
crc32fast = "1"
dotenvy = "0.15"
futures = "0.3"
gpui = {
  package = "gpui",
  git = "https://github.com/monjara/zed",
  branch = "vertical-text-feature"
}
gpui_platform = {
  package = "gpui_platform",
  git = "https://github.com/monjara/zed",
  branch = "vertical-text-feature",
  features = ["font-kit", "runtime_shaders", "wayland", "x11"]
}
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.13.2"
url = "2"
xdg = "3.0.0"
xmlwriter = "0.1"

auth = { path = "crates/auth" }
bottom_bar = { path = "crates/bottom_bar" }
document = { path = "crates/document" }
editor = { path = "crates/editor" }
env = { path = "crates/env" }
icons = { path = "crates/icons" }
keymap = { path = "crates/keymap" }
menu = { path = "crates/menu" }
rich_text = { path = "crates/rich_text" }
rope = { path = "crates/rope" }
settings = { path = "crates/settings" }
theme = { path = "crates/theme" }
tiny_segmenter = { path = "crates/tiny_segmenter" }
title_bar = { path = "crates/title_bar" }
ui = { path = "crates/ui" }
workspace = { path = "crates/workspace" }
