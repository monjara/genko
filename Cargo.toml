[workspace]
members = [".", "crates/genko_rope", "crates/genko_vim"]
default-members = [".", "crates/genko_rope", "crates/genko_vim"]
resolver = "3"

[package]
name = "genko"
version = "0.1.0"
edition = "2024"

[dependencies]
genko_rope = { path = "crates/genko_rope" }
genko_vim = { path = "crates/genko_vim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xdg = "3.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
gpui = "0.2.2"
