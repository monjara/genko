[config]
default_to_workspace = false

[tasks.dev]
command = "cargo"
args = ["run"]

[tasks.watch]
command = "cargo"
args = ["watch", "-x", "run"]

[tasks.test]
command = "cargo"
args = ["test", "--offline", "--all"]

[tasks.test-target]
command = "cargo"
args = ["test", "--offline", "--target", "${@}"]

[tasks.new]
command = "./scripts/new_crate.py"
args = ["${@}"]

[tasks.configure]
command = "nvim"
args = ["${HOME}/.config/genko/settings.json"]
