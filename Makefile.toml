[config]
default_to_workspace = false

[tasks.check]
command = "cargo"
args = ["check"]

[tasks.dev]
command = "cargo"
args = ["run"]

[tasks.dev.env]
SOUKOU_DEVELOPMENT_MODE = "1"

[tasks.watch]
command = "cargo"
args = ["watch", "-x", "run"]

[tasks.watch.env]
SOUKOU_DEVELOPMENT_MODE = "1"
SOUKOU_DEVELOPMENT_WATCH_MODE = "1"

[tasks.format]
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt]
alias = "format"

[tasks.test]
command = "cargo"
args = ["test", "${@}"]

[tasks.test-all]
command = "cargo"
args = ["test", "--all"]

[tasks.test-offline]
command = "cargo"
args = ["test", "--offline", "--all"]

[tasks.test-target]
command = "cargo"
args = ["test", "--offline", "--target", "${@}"]

[tasks.new]
command = "./scripts/new_crate.py"
args = ["${@}"]

[tasks.configure]
command = "nvim"
args = ["${HOME}/.config/soukou/settings.json"]

[tasks.bug]
command = "gh"
args = ["issue", "create", "--template", "BUG_REPORT"]

[tasks.feature]
command = "gh"
args = ["issue", "create", "--template", "FEATURE_REQUEST"]
