[package]
name = "soukou"
version = "0.2.6"
edition = "2024"

[package.metadata.bundle]
icon = ["resources/AppIcon.icns"]
resources = ["resources/AppIcon.icns"]
identifier = "dev.monj.soukou"
name = "草稿"
osx_minimum_system_version = "11.0"
osx_info_plist_exts = ["resources/info/*"]

[[bin]]
name = "soukou"
path = "src/main.rs"

[dependencies]
bottom_bar = { workspace = true }
dotenvy = { workspace = true }
editor = { workspace = true, features = ["embedded-ipadic"] }
env = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
icons = { workspace = true }
menu = { workspace = true }
rope = { workspace = true }
settings = { workspace = true }
theme = { workspace = true }
title_bar = { workspace = true }
ui = { workspace = true }
unicode-segmentation = { workspace = true }
workspace = { workspace = true }
xdg = { workspace = true }

[build-dependencies]
embed-resource = "3"
