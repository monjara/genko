[package]
name = "soukou"
version = "0.2.4"
edition = "2024"

[package.metadata.bundle]
icon = ["resources/AppIcon.icns"]
resources = ["resources/AppIcon.icns"]
identifier = "dev.monj.soukou"
name = "草稿"
osx_minimum_system_version = "11.0"
osx_info_plist_exts = ["resources/info/*"]

[[bin]]
name = "soukou"
path = "src/main.rs"

[dependencies]
bottom_bar = { workspace = true }
document_export = { workspace = true }
dotenvy = { workspace = true }
editor = { workspace = true, features = ["embedded-ipadic"] }
env = { workspace = true }
futures = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls"
] }
richtext = { workspace = true }
rope = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
settings = { workspace = true }
theme = { workspace = true }
title_bar = { workspace = true }
ui = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
xdg = { workspace = true }

[build-dependencies]
embed-resource = "3"
