[package]
name = "vim"
version = "0.1.0"
edition = "2024"

[lib]
name = "vim"
path = "src/vim.rs"

[dependencies]
editor = { workspace = true }
env = { workspace = true }
gpui = { workspace = true }
rope = { workspace = true }
settings = { workspace = true }
theme = { workspace = true }

lindera = "2.3.4"

[features]
default = []
embedded-ipadic = ["lindera/embed-ipadic"]
